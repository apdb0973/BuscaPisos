[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "buscapisos"
version = "0.1.0"
description = "Multichannel real-estate ingestion engine for Gran Canaria."
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.40",
    "playwright-stealth>=2.0",
    "pydantic>=2.5",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "supabase>=2.5",
    "python-dotenv>=1.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
]

[project.scripts]
buscapisos = "buscapisos.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
